# Echo 统一服务编排
# 一键启动所有服务：Blinko UI + PostgreSQL + Janitor
#
# 使用方法：
#   docker-compose up -d
#
# 访问：
#   - Blinko UI: http://localhost:1111
#   - Janitor API: http://localhost:8000

version: '3.8'

services:
  # ============ PostgreSQL 主数据库 ============
  postgres:
    build:
      context: ./echo/docker
      dockerfile: Dockerfile.postgres
    container_name: echo-postgres
    environment:
      - POSTGRES_DB=blinko
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "blinko"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - echo-network

  # ============ Blinko UI ============
  blinko:
    build:
      context: ./get/blinko-main
      dockerfile: ../../echo/docker/Dockerfile.blinko
    container_name: echo-blinko
    ports:
      - "1111:1111"
    environment:
      - NEXTAUTH_URL=http://localhost:1111
      - NEXT_PUBLIC_BASE_URL=http://localhost:1111
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-my_ultra_secure_nextauth_secret}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/blinko
      - JANITOR_API_URL=http://janitor:8000
    depends_on:
      postgres:
        condition: service_healthy
      janitor:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echo-network

  # ============ Janitor AI 整理服务 ============
  janitor:
    build:
      context: ./echo/sidecar/janitor
      dockerfile: ../../../echo/docker/Dockerfile.janitor
    container_name: echo-janitor
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ${INBOX_PATH:-./inbox}:/data/inbox
      - janitor_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - echo-network

volumes:
  postgres_data:
    driver: local
  janitor_logs:
    driver: local

networks:
  echo-network:
    driver: bridge
