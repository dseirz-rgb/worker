# Echo 开发环境 v4.0 - 简化服务编排
# 核心服务：PostgreSQL (pgvector) + Janitor
#
# 使用方法：
#   docker-compose -f docker-compose.dev.yml up -d
#
# 访问：
#   - Blinko UI: http://localhost:1111 (需单独启动 pnpm dev)
#   - Janitor API: http://localhost:8766
#   - PostgreSQL: localhost:5432

services:
  # ============================================================
  # 核心数据库服务
  # ============================================================
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: echo-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=blinko
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinko"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - echo-network

  # ============================================================
  # Janitor AI 整理服务
  # ============================================================
  
  janitor:
    build:
      context: ./echo/sidecar/janitor
      dockerfile: ../../../echo/docker/Dockerfile.janitor
    container_name: echo-janitor
    ports:
      - "8766:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ${INBOX_PATH:-./inbox}:/data/inbox
      - janitor_logs:/app/logs
      - ./echo/sidecar/janitor/config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - echo-network

# ============================================================
# 数据卷
# ============================================================

volumes:
  postgres_data:
    name: echo_postgres_data
  janitor_logs:
    name: echo_janitor_logs

# ============================================================
# 网络
# ============================================================

networks:
  echo-network:
    name: echo-network
    driver: bridge
