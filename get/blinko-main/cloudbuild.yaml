# GCP Cloud Build 配置
# 自动构建并部署到 Cloud Run

steps:
  # 构建 Docker 镜像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/blinko:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/blinko:latest'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '.'

  # 推送镜像到 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/blinko:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/blinko:latest'

  # 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blinko'
      - '--image'
      - 'gcr.io/$PROJECT_ID/blinko:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--port'
      - '1111'
      - '--set-env-vars'
      - 'NODE_ENV=production,TRUST_PROXY=1'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,GROQ_API_KEY=GROQ_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/blinko:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/blinko:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
