# Echo 桌面端构建工作流
# 构建 macOS (arm64) 和 Windows (x64) 版本

name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Install dependencies
        run: bun install
      
      - name: Build Janitor Sidecar
        run: |
          cd echo/sidecar/janitor
          pip3 install pyinstaller
          pyinstaller --onefile --name janitor main.py
          cp dist/janitor ../../../get/blinko-main/src-tauri/binaries/janitor-aarch64-apple-darwin
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: get/blinko-main
          tagName: v__VERSION__
          releaseName: 'Echo v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
      
      - name: Install dependencies
        run: bun install
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build Janitor Sidecar
        run: |
          cd echo/sidecar/janitor
          pip install pyinstaller
          pyinstaller --onefile --name janitor main.py
          copy dist\janitor.exe ..\..\..\get\blinko-main\src-tauri\binaries\janitor-x86_64-pc-windows-msvc.exe
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: get/blinko-main
          tagName: v__VERSION__
          releaseName: 'Echo v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
