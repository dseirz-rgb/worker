<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoAI 首页设计预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.8); }
    .dark .glass { background: rgba(30,30,30,0.8); }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
    .agent-pill { transition: all 0.15s ease; }
    .agent-pill:hover { transform: scale(1.02); }
    .agent-pill.active { box-shadow: 0 0 0 2px currentColor; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-zinc-900 min-h-screen">
  <div class="flex min-h-screen">
    
    <!-- 侧边栏 -->
    <aside class="w-56 bg-white dark:bg-zinc-800 border-r border-gray-200 dark:border-zinc-700 p-4 flex flex-col">
      <!-- 用户头像 -->
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white font-semibold">U</div>
        <span class="font-medium text-gray-800 dark:text-gray-200">用户</span>
        <button class="ml-auto text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </button>
      </div>
      
      <!-- 主导航 -->
      <nav class="space-y-1">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 font-medium">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          首页
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          笔记
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
          文件
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          设置
        </a>
      </nav>
      
      <!-- 分隔线 -->
      <div class="my-4 border-t border-gray-200 dark:border-zinc-700"></div>
      
      <!-- 工具箱 -->
      <div class="mb-2">
        <button class="flex items-center justify-between w-full px-2 py-1 text-xs text-gray-400 uppercase tracking-wider hover:text-gray-600">
          <span>工具</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
      </div>
      <nav class="space-y-1 pl-2">
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-700 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          统计
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-700 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
          翻译
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-700 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          自动化
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-700 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          整理助手
        </a>
      </nav>
      
      <!-- 标签 -->
      <div class="mt-4 border-t border-gray-200 dark:border-zinc-700 pt-4">
        <div class="text-xs text-gray-400 uppercase tracking-wider px-2 mb-2">所有标签</div>
        <div class="space-y-1">
          <a href="#" class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-lg">
            <span class="text-yellow-500">🎉</span> Welcome (4)
          </a>
        </div>
      </div>
      
      <!-- 底部 -->
      <div class="mt-auto pt-4">
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-500 hover:text-orange-500 rounded-lg hover:bg-orange-50 dark:hover:bg-orange-900/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          切换角色
        </a>
      </div>
    </aside>
    
    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col items-center justify-center p-8">
      <div class="w-full max-w-2xl">
        
        <!-- 问候语 -->
        <h1 class="text-3xl font-semibold text-center text-gray-800 dark:text-gray-100 mb-8">
          早上好！
        </h1>
        
        <!-- 输入框 -->
        <div class="glass rounded-2xl border border-gray-200 dark:border-zinc-700 shadow-lg p-4 mb-6">
          <div class="flex items-center gap-3">
            <div class="flex-1">
              <input 
                type="text" 
                placeholder="问我任何问题，或选择下方功能..." 
                class="w-full bg-transparent text-gray-800 dark:text-gray-200 placeholder-gray-400 outline-none text-lg"
              />
            </div>
            <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </button>
            <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <button class="p-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
          </div>
        </div>
        
        <!-- Agent 选择器 -->
        <div class="flex items-center justify-center gap-2 flex-wrap mb-8">
          <button class="agent-pill active px-4 py-2 rounded-full bg-gradient-to-br from-orange-100 to-amber-100 dark:from-orange-900/40 dark:to-amber-900/40 border border-orange-300 dark:border-orange-700/60 text-orange-600 dark:text-orange-400 font-medium text-sm flex items-center gap-2">
            <span>🎯</span> 通用助手
          </button>
          <button class="agent-pill px-4 py-2 rounded-full bg-white/60 dark:bg-zinc-800/60 border border-gray-200 dark:border-zinc-700 text-gray-500 dark:text-gray-400 font-medium text-sm flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-zinc-700">
            <span>🌐</span> 翻译
          </button>
          <button class="agent-pill px-4 py-2 rounded-full bg-white/60 dark:bg-zinc-800/60 border border-gray-200 dark:border-zinc-700 text-gray-500 dark:text-gray-400 font-medium text-sm flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-zinc-700">
            <span>✍️</span> 写作
          </button>
          <button class="agent-pill px-4 py-2 rounded-full bg-white/60 dark:bg-zinc-800/60 border border-gray-200 dark:border-zinc-700 text-gray-500 dark:text-gray-400 font-medium text-sm flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-zinc-700">
            <span>💻</span> 代码
          </button>
          <button class="agent-pill px-3 py-2 rounded-full bg-white/60 dark:bg-zinc-800/60 border border-gray-200 dark:border-zinc-700 text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-zinc-700" title="管理 Agent">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>
        
        <!-- AI 功能卡片 -->
        <div class="grid grid-cols-3 gap-4 mb-8">
          <!-- 知识搜索 -->
          <div class="card-hover bg-white dark:bg-zinc-800 rounded-2xl p-5 border border-gray-200 dark:border-zinc-700 cursor-pointer group">
            <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center mb-3 group-hover:scale-110 transition">
              <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <h3 class="font-semibold text-gray-800 dark:text-gray-200 mb-1">知识搜索</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">语义检索笔记和文件</p>
          </div>
          
          <!-- 深度研究 -->
          <div class="card-hover bg-white dark:bg-zinc-800 rounded-2xl p-5 border border-gray-200 dark:border-zinc-700 cursor-pointer group">
            <div class="w-10 h-10 rounded-xl bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center mb-3 group-hover:scale-110 transition">
              <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            </div>
            <h3 class="font-semibold text-gray-800 dark:text-gray-200 mb-1">深度研究</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">多轮迭代分析</p>
          </div>
          
          <!-- 生成日报 -->
          <div class="card-hover bg-white dark:bg-zinc-800 rounded-2xl p-5 border border-gray-200 dark:border-zinc-700 cursor-pointer group">
            <div class="w-10 h-10 rounded-xl bg-green-100 dark:bg-green-900/30 flex items-center justify-center mb-3 group-hover:scale-110 transition">
              <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h3 class="font-semibold text-gray-800 dark:text-gray-200 mb-1">生成日报</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">一键汇总今日内容</p>
          </div>
        </div>
        
        <!-- 最近对话 -->
        <div>
          <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-3">最近对话</h2>
          <div class="space-y-2">
            <div class="flex items-center justify-between p-3 bg-white dark:bg-zinc-800 rounded-xl border border-gray-200 dark:border-zinc-700 hover:border-orange-300 dark:hover:border-orange-700 cursor-pointer transition group">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center">
                  <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <div>
                  <p class="text-sm font-medium text-gray-800 dark:text-gray-200">关于项目架构的讨论</p>
                  <p class="text-xs text-gray-400">2小时前</p>
                </div>
              </div>
              <span class="text-orange-500 opacity-0 group-hover:opacity-100 transition text-sm">继续 →</span>
            </div>
            
            <div class="flex items-center justify-between p-3 bg-white dark:bg-zinc-800 rounded-xl border border-gray-200 dark:border-zinc-700 hover:border-orange-300 dark:hover:border-orange-700 cursor-pointer transition group">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                </div>
                <div>
                  <p class="text-sm font-medium text-gray-800 dark:text-gray-200">代码审查建议</p>
                  <p class="text-xs text-gray-400">昨天</p>
                </div>
              </div>
              <span class="text-orange-500 opacity-0 group-hover:opacity-100 transition text-sm">继续 →</span>
            </div>
            
            <div class="flex items-center justify-between p-3 bg-white dark:bg-zinc-800 rounded-xl border border-gray-200 dark:border-zinc-700 hover:border-orange-300 dark:hover:border-orange-700 cursor-pointer transition group">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
                  <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <div>
                  <p class="text-sm font-medium text-gray-800 dark:text-gray-200">周报生成</p>
                  <p class="text-xs text-gray-400">2天前</p>
                </div>
              </div>
              <span class="text-orange-500 opacity-0 group-hover:opacity-100 transition text-sm">继续 →</span>
            </div>
          </div>
        </div>
        
      </div>
    </main>
    
  </div>
  
  <!-- 暗色模式切换 -->
  <button onclick="document.documentElement.classList.toggle('dark')" class="fixed bottom-4 right-4 p-3 bg-white dark:bg-zinc-800 rounded-full shadow-lg border border-gray-200 dark:border-zinc-700 hover:scale-110 transition">
    <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
  </button>
  
</body>
</html>""
