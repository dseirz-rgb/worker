# Khoj Docker Compose 配置
# 用于在本地运行 Khoj 服务
#
# 使用方法:
#   启动: docker-compose -f docker-compose.khoj.yml up -d
#   停止: docker-compose -f docker-compose.khoj.yml down
#   查看日志: docker-compose -f docker-compose.khoj.yml logs -f
#
# Khoj 服务将在 http://localhost:42110 可用

version: '3.8'

services:
  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    container_name: echo-khoj
    ports:
      - "42110:42110"
    volumes:
      # 数据持久化
      - khoj_data:/root/.khoj
      # 可选：挂载本地文档目录
      # - ./documents:/documents:ro
    environment:
      # Khoj 配置
      - KHOJ_DEBUG=false
      - KHOJ_ANONYMOUS_MODE=true
      # 数据库配置（使用内置 SQLite）
      - KHOJ_DATABASE_TYPE=sqlite
      # 可选：配置 OpenAI API（用于 AI 功能）
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # 可选：配置 Google AI API
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42110/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - echo-network

  # 可选：PostgreSQL 数据库（用于生产环境）
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: echo-khoj-postgres
  #   environment:
  #     - POSTGRES_USER=khoj
  #     - POSTGRES_PASSWORD=khoj_password
  #     - POSTGRES_DB=khoj
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - echo-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U khoj"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  khoj_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  echo-network:
    driver: bridge
