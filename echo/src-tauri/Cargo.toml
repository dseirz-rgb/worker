[package]
name = "echo"
version = "0.1.0"
description = "Echo - AI 个人助手"
authors = ["lidezhe"]
edition = "2021"

[lib]
name = "echo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }
# fastembed-rs 本地嵌入 (Task 3)
fastembed = "4"
tokio = { version = "1", features = ["sync"] }
once_cell = "1.19"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
